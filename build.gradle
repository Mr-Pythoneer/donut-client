plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories { mavenCentral() }

loom {
    splitEnvironmentSourceSets()
    mods {
        'donut' {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

sourceSets.test {
    compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
    runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
}

test { useJUnitPlatform() }

// A focused native runtime suite; toggling the property invalidates processed test resources.
tasks.matching { it.name == 'processGametestResources' }.configureEach {
    inputs.property('soundDetectorTestsOnly', providers.gradleProperty('soundDetectorTestsOnly').orElse('false'))
    inputs.property('blockEspTestsOnly', providers.gradleProperty('blockEspTestsOnly').orElse('false'))
    inputs.property('staffDetectorTestsOnly', providers.gradleProperty('staffDetectorTestsOnly').orElse('false'))
    inputs.property('freecamTestsOnly', providers.gradleProperty('freecamTestsOnly').orElse('false'))
    inputs.property('storageEspTestsOnly', providers.gradleProperty('storageEspTestsOnly').orElse('false'))
    inputs.property('qolTestsOnly', providers.gradleProperty('qolTestsOnly').orElse('false'))
    inputs.property('newToolsCTestsOnly', providers.gradleProperty('newToolsCTestsOnly').orElse('false'))
    inputs.property('testingGroundsOnly', providers.gradleProperty('testingGroundsOnly').orElse('false'))
    inputs.property('uiPreviewOnly', providers.gradleProperty('uiPreviewOnly').orElse('false'))
    inputs.property('demoReelOnly', providers.gradleProperty('demoReelOnly').orElse('false'))
    inputs.property('killSwitchTestsOnly', providers.gradleProperty('killSwitchTestsOnly').orElse('false'))
    inputs.property('antiCheatProbeOnly', providers.gradleProperty('antiCheatProbeOnly').orElse('false'))
    inputs.property('gametestSkip', providers.gradleProperty('gametestSkip').orElse(''))
    inputs.property('autoMinerTestsOnly', providers.gradleProperty('autoMinerTestsOnly').orElse('false'))
    inputs.property('newToolsBTestsOnly', providers.gradleProperty('newToolsBTestsOnly').orElse('false'))
    inputs.property('newToolsATestsOnly', providers.gradleProperty('newToolsATestsOnly').orElse('false'))
    doLast {
        // -PgametestSkip=ClassA,ClassB leaves known-broken suites out of an otherwise full run.
        def skip = providers.gradleProperty('gametestSkip').orElse('').get().split(',').findAll { it }
        if (!skip.isEmpty()) {
            def manifest = new File(destinationDir, 'fabric.mod.json')
            def data = new groovy.json.JsonSlurper().parse(manifest)
            data.entrypoints['fabric-client-gametest'] = data.entrypoints['fabric-client-gametest'].findAll { entry ->
                !skip.any { entry.endsWith('.' + it) } }
            manifest.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(data))
        }
        if (providers.gradleProperty('killSwitchTestsOnly').orElse('false').get() == 'true') {
            def manifest = new File(destinationDir, 'fabric.mod.json')
            def data = new groovy.json.JsonSlurper().parse(manifest)
            data.entrypoints['fabric-client-gametest'] = ['dev.donut.client.gametest.KillSwitchGameTest']
            manifest.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(data))
        }
        // Developer tool: joins a local anti-cheat test server (tools/anticheat-server.sh) and exercises each module. Not a test.
        if (providers.gradleProperty('antiCheatProbeOnly').orElse('false').get() == 'true') {
            def manifest = new File(destinationDir, 'fabric.mod.json')
            def data = new groovy.json.JsonSlurper().parse(manifest)
            data.entrypoints['fabric-client-gametest'] = ['dev.donut.client.gametest.AntiCheatProbeGameTest']
            manifest.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(data))
        } else
        // Developer tool: records demo/donut-client-demo.mp4 (needs ffmpeg). Not a test.
        if (providers.gradleProperty('demoReelOnly').orElse('false').get() == 'true') {
            def manifest = new File(destinationDir, 'fabric.mod.json')
            def data = new groovy.json.JsonSlurper().parse(manifest)
            data.entrypoints['fabric-client-gametest'] = ['dev.donut.client.gametest.DemoReelGameTest']
            manifest.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(data))
        } else
        // Developer tool: screenshots of the HUD panels and click GUI for visual review. Not a test.
        if (providers.gradleProperty('uiPreviewOnly').orElse('false').get() == 'true') {
            def manifest = new File(destinationDir, 'fabric.mod.json')
            def data = new groovy.json.JsonSlurper().parse(manifest)
            data.entrypoints['fabric-client-gametest'] = ['dev.donut.client.gametest.UiPreviewGameTest']
            manifest.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(data))
        } else
        // Developer tool: builds run/saves/donut-testing-grounds for ./gradlew runClient. Not a test.
        if (providers.gradleProperty('testingGroundsOnly').orElse('false').get() == 'true') {
            def manifest = new File(destinationDir, 'fabric.mod.json')
            def data = new groovy.json.JsonSlurper().parse(manifest)
            data.entrypoints['fabric-client-gametest'] = ['dev.donut.client.gametest.TestingGroundsBuilder']
            manifest.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(data))
        } else
        if (providers.gradleProperty('newToolsATestsOnly').orElse('false').get() == 'true') {
            def manifest = new File(destinationDir, 'fabric.mod.json')
            def data = new groovy.json.JsonSlurper().parse(manifest)
            data.entrypoints['fabric-client-gametest'] = [
                'dev.donut.client.gametest.FreelookGameTest',
                'dev.donut.client.gametest.AutoEatGameTest',
                'dev.donut.client.gametest.AutoReconnectGameTest',
                'dev.donut.client.gametest.NewToolsGuiGameTest',
                'dev.donut.client.gametest.ModuleKeybindGameTest'
            ]
            manifest.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(data))
        } else
        if (providers.gradleProperty('autoMinerTestsOnly').orElse('false').get() == 'true') {
            def manifest = new File(destinationDir, 'fabric.mod.json')
            def data = new groovy.json.JsonSlurper().parse(manifest)
            data.entrypoints['fabric-client-gametest'] = [
                'dev.donut.client.gametest.AutoMinerGameTest',
                'dev.donut.client.gametest.AutoMinerGuiGameTest',
                'dev.donut.client.gametest.ModuleKeybindGameTest'
            ]
            manifest.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(data))
        } else
        if (providers.gradleProperty('newToolsCTestsOnly').orElse('false').get() == 'true') {
            def manifest = new File(destinationDir, 'fabric.mod.json')
            def data = new groovy.json.JsonSlurper().parse(manifest)
            data.entrypoints['fabric-client-gametest'] = [
                'dev.donut.client.gametest.HudWidgetsGameTest',
                'dev.donut.client.gametest.NewChunksGameTest',
                'dev.donut.client.gametest.StashFinderGameTest',
                'dev.donut.client.gametest.NewToolsCGuiGameTest',
                'dev.donut.client.gametest.ModuleKeybindGameTest'
            ]
            manifest.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(data))
        } else
        if (providers.gradleProperty('qolTestsOnly').orElse('false').get() == 'true') {
            def manifest = new File(destinationDir, 'fabric.mod.json')
            def data = new groovy.json.JsonSlurper().parse(manifest)
            data.entrypoints['fabric-client-gametest'] = [
                'dev.donut.client.gametest.QualityOfLifeGameTest',
                'dev.donut.client.gametest.QualityOfLifeGuiGameTest',
                'dev.donut.client.gametest.ModuleKeybindGameTest'
            ]
            manifest.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(data))
        } else
        if (providers.gradleProperty('newToolsBTestsOnly').orElse('false').get() == 'true') {
            def manifest = new File(destinationDir, 'fabric.mod.json')
            def data = new groovy.json.JsonSlurper().parse(manifest)
            data.entrypoints['fabric-client-gametest'] = [
                'dev.donut.client.gametest.PlayerEspGameTest',
                'dev.donut.client.gametest.PlayerEspGuiGameTest',
                'dev.donut.client.gametest.SearchGameTest',
                'dev.donut.client.gametest.SearchGuiGameTest',
                'dev.donut.client.gametest.ModuleKeybindGameTest'
            ]
            manifest.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(data))
        } else
        if (providers.gradleProperty('storageEspTestsOnly').orElse('false').get() == 'true') {
            def manifest = new File(destinationDir, 'fabric.mod.json')
            def data = new groovy.json.JsonSlurper().parse(manifest)
            data.entrypoints['fabric-client-gametest'] = [
                'dev.donut.client.gametest.StorageEspGameTest',
                'dev.donut.client.gametest.StorageEspGuiGameTest',
                'dev.donut.client.gametest.ModuleKeybindGameTest'
            ]
            manifest.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(data))
        } else
        if (providers.gradleProperty('freecamTestsOnly').orElse('false').get() == 'true') {
            def manifest = new File(destinationDir, 'fabric.mod.json')
            def data = new groovy.json.JsonSlurper().parse(manifest)
            data.entrypoints['fabric-client-gametest'] = [
                'dev.donut.client.gametest.FreecamGameTest',
                'dev.donut.client.gametest.ModuleKeybindGameTest'
            ]
            manifest.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(data))
        } else
        if (providers.gradleProperty('staffDetectorTestsOnly').orElse('false').get() == 'true') {
            def manifest = new File(destinationDir, 'fabric.mod.json')
            def data = new groovy.json.JsonSlurper().parse(manifest)
            data.entrypoints['fabric-client-gametest'] = [
                'dev.donut.client.gametest.StaffDetectorGameTest',
                'dev.donut.client.gametest.StaffDetectorGuiGameTest',
                'dev.donut.client.gametest.ModuleKeybindGameTest'
            ]
            manifest.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(data))
        } else if (providers.gradleProperty('blockEspTestsOnly').orElse('false').get() == 'true') {
            def manifest = new File(destinationDir, 'fabric.mod.json')
            def data = new groovy.json.JsonSlurper().parse(manifest)
            data.entrypoints['fabric-client-gametest'] = [
                'dev.donut.client.gametest.BlockEspGameTest',
                'dev.donut.client.gametest.BlockEspGuiGameTest',
                'dev.donut.client.gametest.ModuleKeybindGameTest'
            ]
            manifest.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(data))
        } else
        if (providers.gradleProperty('soundDetectorTestsOnly').orElse('false').get() == 'true') {
            def manifest = new File(destinationDir, 'fabric.mod.json')
            def data = new groovy.json.JsonSlurper().parse(manifest)
            data.entrypoints['fabric-client-gametest'] = [
                'dev.donut.client.gametest.SoundDetectorGameTest',
                'dev.donut.client.gametest.SoundDetectorGuiGameTest',
                'dev.donut.client.gametest.ModuleKeybindGameTest'
            ]
            manifest.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(data))
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'donut-gametest'
        enableGameTests = false
        enableClientGameTests = true
    }
}

// Test-build expiry (see KillSwitch): hours of real time after a build first runs; -PkillSwitchHours=0 builds one that never expires.
def killSwitchHours = providers.gradleProperty('killSwitchHours').orElse('72').get()
def buildId = project.version + '-' + new Date().format("yyyyMMdd'T'HHmmss", TimeZone.getTimeZone('UTC'))
processResources {
    inputs.property 'version', project.version
    inputs.property 'killSwitchHours', killSwitchHours
    inputs.property 'buildId', buildId
    filesMatching('fabric.mod.json') { expand 'version': project.version }
    filesMatching('donut-build.properties') { expand 'buildId': buildId, 'killSwitchHours': killSwitchHours }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

jar { from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } } }

// Client gametest JVM options: the probe joins a real server whose plugins rewrite packets, which Fabric's
// network synchronizer cannot follow; and the kill-switch clock lives in the run directory, not in ~/.donut-client.
tasks.matching { it.name == 'runClientGameTest' }.configureEach {
    jvmArgs "-Ddonut.killswitch.dir=${layout.buildDirectory.dir('run/clientGameTest-killswitch').get().asFile}"
    if (providers.gradleProperty('antiCheatProbeOnly').orElse('false').get() == 'true')
        jvmArgs '-Dfabric.client.gametest.disableNetworkSynchronizer=true'
}
